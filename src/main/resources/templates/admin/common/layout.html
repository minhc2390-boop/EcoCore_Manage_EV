<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Super Admin | Job Portal Cần Thơ'">Super Admin - Job Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/employer.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        .badge-pending {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11.5px;
            font-weight: 700;
        }
        .badge-approved {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11.5px;
            font-weight: 700;
        }
        .badge-locked {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11.5px;
            font-weight: 700;
        }
    </style>
</head>
<body class="employer-portal">

<aside th:fragment="sidebar(activeMenu)" class="employer-sidebar" id="employerSidebar">
    <div class="sidebar-brand">
        <div class="brand-logo-symbol" style="background: #dc2626; color: #fff;">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <div>
            <div class="brand-title-text">JOB <span class="brand-title-accent text-danger">PORTAL</span></div>
            <span class="badge mt-1" style="background: rgba(220, 38, 38, 0.08); color: #dc2626; font-size: 10.5px; font-weight: 700;">Super Admin</span>
        </div>
    </div>

    <div class="sidebar-nav">
        <div class="nav-section-label">Điều Hành Sàn Tuyển Dụng</div>

        <a th:href="@{/admin/dashboard}" class="employer-nav-link" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
            <i class="bi bi-speedometer2"></i>
            <span>Tổng quan sàn</span>
        </a>

        <a th:href="@{/admin/companies}" class="employer-nav-link" th:classappend="${activeMenu == 'companies' ? 'active' : ''}">
            <i class="bi bi-building-check"></i>
            <span>Duyệt & Quản lý Công ty</span>
        </a>

        <a th:href="@{/admin/jobs}" class="employer-nav-link" th:classappend="${activeMenu == 'jobs' ? 'active' : ''}">
            <i class="bi bi-file-earmark-text"></i>
            <span>Giám sát tin đăng TP.CT</span>
        </a>

        <a th:href="@{/admin/reports}" class="employer-nav-link" th:classappend="${activeMenu == 'reports' ? 'active' : ''}">
            <i class="bi bi-bar-chart-line-fill"></i>
            <span>Báo cáo thống kê sàn</span>
        </a>
    </div>

    <div class="employer-sidebar-footer">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2 overflow-hidden">
                <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white" style="width: 36px; height: 36px; min-width: 36px; background: #dc2626;">
                    <i class="bi bi-shield-shaded"></i>
                </div>
                <div class="overflow-hidden">
                    <div class="fw-bold text-truncate small" style="color: var(--navy-primary);" th:text="${session.currentUser != null ? session.currentUser.username : 'superadmin'}">superadmin</div>
                    <div class="text-secondary" style="font-size: 11px;">Quản trị tối cao sàn</div>
                </div>
            </div>
            <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger border-0 rounded-circle p-2" title="Đăng xuất">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
    </div>
</aside>

<div th:fragment="topbar(pageTitle)" class="employer-topbar">
    <div class="employer-topbar-inner">
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-outline-secondary d-lg-none btn-sm" id="sidebarToggleBtn" type="button">
                <i class="bi bi-list fs-5"></i>
            </button>
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0" style="font-size: 12px;">
                        <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none text-secondary">Super Admin</a></li>
                        <li class="breadcrumb-item active fw-bold text-danger" aria-current="page" th:text="${pageTitle}">Trang</li>
                    </ol>
                </nav>
                <h5 class="fw-bold mb-0 d-none d-md-block" style="color: var(--navy-primary);" th:text="${pageTitle}">Tiêu đề trang</h5>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2.5">
            <span class="badge bg-danger-subtle text-danger px-3 py-1.5 rounded-pill fw-semibold small d-none d-sm-inline">
                <i class="bi bi-shield-check me-1"></i>Chế độ Giám sát Sàn
            </span>

            <div class="dropdown">
                <button class="btn btn-light bg-white border rounded-pill d-flex align-items-center gap-2 py-1 px-3 dropdown-toggle shadow-sm" type="button" data-bs-toggle="dropdown">
                    <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 28px; height: 28px; background: rgba(220, 38, 38, 0.1); color: #dc2626;">
                        <i class="bi bi-shield-shaded"></i>
                    </div>
                    <span class="small fw-bold" style="color: var(--navy-primary);" th:text="${session.currentUser != null ? session.currentUser.username : 'superadmin'}">superadmin</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 mt-2">
                    <li><a class="dropdown-item py-2" th:href="@{/profile}"><i class="bi bi-person me-2 text-primary"></i>Hồ sơ quản trị</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item py-2 text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<div th:fragment="scripts">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var sidebar = document.getElementById('employerSidebar');
            var overlay = document.getElementById('sidebarOverlay');
            var toggleBtn = document.getElementById('sidebarToggleBtn');

            if (toggleBtn && sidebar && overlay) {
                toggleBtn.addEventListener('click', function () {
                    sidebar.classList.toggle('show');
                    overlay.classList.toggle('show');
                });
                overlay.addEventListener('click', function () {
                    sidebar.classList.remove('show');
                    overlay.classList.remove('show');
                });
            }
        });
    </script>
</div>
</body>
</html>
