<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header :: header-head}"></head>
<body class="bg-light">

<nav th:replace="~{common/header :: header-nav}"></nav>

<div class="container py-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang Chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page">Danh Sách Việc Làm</li>
        </ol>
    </nav>

    <!-- Filter Card Bar -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
        <form th:action="@{/jobs}" method="get" class="row g-2 align-items-center">
            <div class="col-md-4">
                <input type="text" name="keyword" class="form-control rounded-3" 
                       placeholder="Từ khóa (Chức danh, kỹ năng, địa điểm)..." th:value="${searchDTO.keyword}">
            </div>
            <div class="col-md-3">
                <select name="categoryId" class="form-select rounded-3">
                    <option value="">-- Tất cả ngành nghề --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" 
                            th:selected="${searchDTO.categoryId == cat.id}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="jobType" class="form-select rounded-3">
                    <option value="">-- Hình thức làm việc --</option>
                    <option value="Part-time" th:selected="${searchDTO.jobType == 'Part-time'}">Bán thời gian (Part-time)</option>
                    <option value="Internship" th:selected="${searchDTO.jobType == 'Internship'}">Thực tập sinh (Internship)</option>
                    <option value="Remote" th:selected="${searchDTO.jobType == 'Remote'}">Việc làm từ xa (Remote)</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100 rounded-3 fw-semibold">
                    <i class="bi bi-funnel me-1"></i>Lọc Tin
                </button>
            </div>
        </form>
    </div>

    <!-- Job Results Count -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Tìm thấy <span class="text-primary" th:text="${jobs.size()}">0</span> việc làm phù hợp cho sinh viên</h5>
    </div>

    <!-- Job List -->
    <div class="row g-3">
        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(jobs)}">
            <div class="p-5 bg-white rounded-4 shadow-sm">
                <i class="bi bi-inbox fs-1 text-muted"></i>
                <h5 class="fw-bold mt-3 text-secondary">Không tìm thấy công việc nào phù hợp!</h5>
                <p class="text-muted small">Hãy thử tìm kiếm với từ khóa khác hoặc xóa bớt bộ lọc.</p>
                <a th:href="@{/jobs}" class="btn btn-outline-primary btn-sm rounded-pill px-4">Xem tất cả việc làm</a>
            </div>
        </div>

        <div class="col-12" th:each="job : ${jobs}">
            <div class="card job-list-card border-0 shadow-sm rounded-4 p-4 transition bg-white">
                <div class="row align-items-center g-3">
                    <div class="col-md-8">
                        <div class="d-flex gap-2 mb-2">
                            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill fw-semibold" th:text="${job.jobType}">
                                Part-time
                            </span>
                            <span class="badge bg-info bg-opacity-10 text-info px-3 py-1 rounded-pill fw-semibold" 
                                  th:text="${job.category != null ? job.category.name : 'Chung'}">
                                Ngành nghề
                            </span>
                        </div>
                        <h5 class="fw-bold mb-1">
                            <a th:href="@{/jobs/{id}(id=${job.id})}" class="text-decoration-none text-dark hover-primary" th:text="${job.title}">
                                Tiêu đề việc làm
                            </a>
                        </h5>
                        <p class="text-secondary small mb-2">
                            <i class="bi bi-building me-1 text-primary"></i>
                            <strong th:text="${job.employer != null ? job.employer.companyName : 'Doanh nghiệp'}">Tên công ty</strong>
                            <span class="mx-2">•</span>
                            <i class="bi bi-geo-alt me-1 text-danger"></i><span th:text="${job.location}">TP. HCM</span>
                        </p>
                        <div class="text-muted small">
                            <i class="bi bi-clock-history me-1 text-warning"></i><span th:text="${job.shiftSchedule}">Ca làm</span>
                        </div>
                    </div>
                    <div class="col-md-4 text-md-end">
                        <div class="text-success fw-bold fs-5 mb-2" th:text="${job.salaryRange}">25k/h</div>
                        <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-primary rounded-pill px-4 fw-medium shadow-sm">
                            Xem &amp; Ứng Tuyển <i class="bi bi-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{common/footer :: footer}"></footer>
</body>
</html>
