<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header-head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniWork - Nền Tảng Tìm Việc Làm &amp; Thực Tập Cho Sinh Viên</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/realtime-notification.js}" src="/js/realtime-notification.js" defer></script>
</head>
<body>
<nav th:fragment="header-nav" class="navbar navbar-expand-xl navbar-dark bg-gradient-primary shadow-sm sticky-top py-2">
    <div class="container-xxl px-3 px-xl-4">
        <a class="navbar-brand fw-bold d-flex align-items-center text-nowrap me-3" th:href="@{/}">
            <span class="brand-logo-symbol me-2" style="width: 36px; height: 36px; min-width: 36px; border-radius: 10px; background: linear-gradient(135deg, #1e40af, #3b82f6); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.25);">
                <i class="bi bi-briefcase-fill text-white fs-6"></i>
            </span>
            <span class="fs-5 text-white">JOB <span class="text-warning">PORTAL</span><span style="color:#f59e0b;">.</span></span>
        </a>
        <button class="navbar-toggler border-white border-opacity-25" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Menu điều hướng">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-xl-0 ms-xl-2">
                <li class="nav-item">
                    <a class="nav-link text-white fw-medium text-nowrap" th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i>Trang Chủ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white fw-medium text-nowrap" th:href="@{/jobs}">
                        <i class="bi bi-search me-1"></i>Tìm Việc Làm
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50 fw-medium text-nowrap" th:href="@{/jobs(jobType='Part-time')}">
                        <i class="bi bi-clock-history me-1"></i>Việc Part-time
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50 fw-medium text-nowrap" th:href="@{/jobs(jobType='Internship')}">
                        <i class="bi bi-award me-1"></i>Thực Tập Sinh
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50 fw-medium text-nowrap" th:href="@{/companies}">
                        <i class="bi bi-buildings me-1"></i>Doanh Nghiệp
                    </a>
                </li>
                <!-- Menu Cổng Tuyển Dụng dành cho Company Admin -->
                <li class="nav-item" th:if="${session.currentUser != null and session.currentUser.role.name() == 'COMPANY_ADMIN'}">
                    <a class="nav-link text-warning fw-bold text-nowrap" th:href="@{/employer/dashboard}">
                        <i class="bi bi-grid-1x2-fill me-1"></i>Tổng Quan Doanh Nghiệp
                    </a>
                </li>
                <!-- Menu Dành riêng cho Super Admin -->
                <li class="nav-item" th:if="${session.currentUser != null and session.currentUser.role.name() == 'SUPER_ADMIN'}">
                    <a class="nav-link text-danger fw-bold text-nowrap" th:href="@{/admin/dashboard}">
                        <i class="bi bi-shield-lock-fill me-1"></i>Super Admin
                    </a>
                </li>
            </ul>
            <div class="d-flex flex-wrap flex-xl-nowrap align-items-center gap-2 mt-3 mt-xl-0 pt-2 pt-xl-0 border-top border-xl-0 border-white border-opacity-10">
                <a th:href="@{/employer/jobs}" class="btn btn-warning btn-sm px-3 rounded-pill fw-semibold text-dark shadow-sm text-nowrap">
                    <i class="bi bi-building-add me-1"></i>Nhà Tuyển Dụng
                </a>
                <div th:if="${session.currentUser == null}" class="d-flex align-items-center gap-2 ms-xl-2 flex-nowrap">
                    <a th:href="@{/login}" class="btn btn-sm btn-outline-light rounded-pill px-3 py-1 text-nowrap">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                    </a>
                    <a th:href="@{/register}" class="btn btn-sm btn-light rounded-pill px-3 py-1 fw-semibold text-dark text-nowrap">
                        <i class="bi bi-person-plus me-1"></i>Đăng ký
                    </a>
                </div>
                <div th:if="${session.currentUser != null}" class="d-flex align-items-center gap-2 ms-xl-2 flex-nowrap">
                    <!-- Chuông Thông Báo Real-time SSE -->
                    <div class="dropdown position-relative">
                        <button class="btn btn-outline-light btn-sm rounded-circle position-relative d-flex align-items-center justify-content-center" 
                                type="button" id="notifDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false" 
                                style="width: 34px; height: 34px; padding: 0;" title="Thông báo thời gian thực">
                            <i class="bi bi-bell-fill"></i>
                            <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 9px; padding: 3px 5px;">0</span>
                        </button>
                        <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 p-0 mt-2" aria-labelledby="notifDropdownBtn" style="width: 320px; max-height: 400px; overflow-y: auto;">
                            <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light rounded-top-4">
                                <h6 class="mb-0 fw-bold text-dark" style="font-size: 13.5px;"><i class="bi bi-bell me-1 text-primary"></i>Thông Báo Realtime</h6>
                                <div class="d-flex align-items-center gap-2">
                                    <button class="btn btn-link btn-sm text-decoration-none p-0 text-muted" id="btnClearNotif" style="font-size: 11px;">Đã đọc hết</button>
                                    <button type="button" class="btn btn-light btn-sm text-muted rounded-circle p-0 d-flex align-items-center justify-content-center" data-bs-toggle="dropdown" style="width: 22px; height: 22px; font-size: 11px; border: 1px solid #dee2e6;" title="Đóng thông báo">✕</button>
                                </div>
                            </div>
                            <div id="notifList" class="p-2">
                                <div class="text-center text-muted py-3 small" id="notifEmpty">Không có thông báo mới</div>
                            </div>
                            <div class="p-2 border-top text-center bg-light rounded-bottom-4">
                                <button class="btn btn-outline-primary btn-sm rounded-pill w-100 py-1" id="btnTestNotif" style="font-size: 11.5px;">
                                    <i class="bi bi-lightning-charge-fill me-1"></i>Gửi thông báo test
                                </button>
                            </div>
                        </div>
                    </div>

                    <a th:href="@{/profile}" class="btn btn-sm btn-outline-light rounded-pill px-2.5 py-1 text-truncate" style="max-width: 140px;" th:title="${session.currentUser.username}">
                        <i class="bi bi-person-circle me-1"></i><span th:text="${session.currentUser.username}">User</span>
                    </a>
                    <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger text-white border-0 py-1" title="Đăng xuất">
                        <i class="bi bi-box-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
