<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header :: header-head}"></head>
<body class="bg-light">

<nav th:replace="~{common/header :: header-nav}"></nav>

<div class="container py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto bg-white" style="max-width: 600px;">
        <i class="bi bi-exclamation-triangle-fill fs-1 text-warning mb-3"></i>
        <h3 class="fw-bold mb-2">Đã Xảy Ra Lỗi</h3>
        <p class="text-secondary mb-4" th:text="${errorMessage != null ? errorMessage : 'Trang bạn tìm kiếm không tồn tại hoặc hệ thống đang bảo trì.'}">
            Thông báo lỗi...
        </p>
        <div>
            <a th:href="@{/}" class="btn btn-primary rounded-pill px-4 me-2">Về Trang Chủ</a>
            <a th:href="@{/jobs}" class="btn btn-outline-secondary rounded-pill px-4">Tìm Việc Làm</a>
        </div>
    </div>
</div>

<footer th:replace="~{common/footer :: footer}"></footer>
</body>
</html>
