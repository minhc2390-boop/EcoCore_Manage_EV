# ===============================================
# Cấu hình Cổng máy chủ (Server Port)
# ===============================================
server.port=8080
server.servlet.context-path=/

# ===============================================
# Cấu hình Thymeleaf Template Engine (Slide 1.1 FPT Polytechnic)
# ===============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===============================================
# Cấu hình Kết nối CSDL SQL Server (UniWorkDB)
# ===============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=UniWorkDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================================
# Tối ưu hóa HikariCP Connection Pool (Chống quá tải DB)
# ===============================================
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# ===============================================
# Tối ưu hóa Luồng Java 21 (Virtual Threads - Chịu tải cao)
# ===============================================
spring.threads.virtual.enabled=true

# ===============================================
# Bộ nhớ đệm In-Memory Spring Cache (Tăng tốc độ đọc dữ liệu)
# ===============================================
spring.cache.type=simple

# ===============================================
# Cấu hình Hibernate / JPA
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===============================================
# Cấu hình Thư mục Tĩnh (CSS, JS, Images)
# ===============================================
spring.web.resources.static-locations=classpath:/static/
