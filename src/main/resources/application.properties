# ===============================================
# Cấu hình Cổng máy chủ (Server Port)
# ===============================================
server.port=8080
server.servlet.context-path=/

# ===============================================
# Cấu hình JSP View Resolver cho Thư mục WebApp
# ===============================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===============================================
# Cấu hình Kết nối CSDL SQL Server (Java 5)
# Sửa lại tên CSDL, username, password tương ứng
# ===============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=EVCSMS_DB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================================
# Cấu hình Hibernate / JPA (Tự tạo/cập nhật bảng)
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===============================================
# Cấu hình Thư mục Tĩnh (CSS, JS, Images)
# ===============================================
spring.web.resources.static-locations=classpath:/static/,/assets/
