# ===============================================
# Cấu hình Cổng máy chủ (Server Port)
# ===============================================
server.port=8080
server.servlet.context-path=/

# ===============================================
# Cấu hình Thymeleaf Template Engine (Slide 1.1 FPT Polytechnic)
# ===============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===============================================
# Cấu hình Kết nối CSDL SQL Server (StudentJobDB)
# ===============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StudentJobDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================================
# Cấu hình Hibernate / JPA
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===============================================
# Cấu hình Thư mục Tĩnh (CSS, JS, Images)
# ===============================================
spring.web.resources.static-locations=classpath:/static/
